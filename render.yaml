databases:
  - name: tic-ues-db
    plan: free
    databaseName: tic_ues
    user: tic_ues
    postgresMajorVersion: "16"

services:
  - type: web
    name: tic-ues
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Guayaquil
      - key: APP_LOCALE
        value: es
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: tic-ues-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: CARGAR_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false